name: Build

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Flex and Bison
        run: choco install winflexbison3 -y --no-progress

      - name: Dependencies (vcpkg)
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install sdl2 sdl2-image boost-filesystem --triplet x64-windows-static-md
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Patch submodules
        run: |
          git -C dependencies/submodules/piranha apply ../../../patches/piranha-local.patch
          git -C dependencies/submodules/delta-studio apply ../../../patches/delta-studio-local.patch

      - name: Build
        shell: cmd
        run: tools\windows-build\build.bat

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/engine-sim-tuner/bin | Out-Null
          Copy-Item build/engine-sim-server.exe, build/engine-sim-app.exe dist/engine-sim-tuner/bin/
          Get-ChildItem build -Filter *.dll | Copy-Item -Destination dist/engine-sim-tuner/bin/
          Copy-Item assets dist/engine-sim-tuner/assets -Recurse
          Remove-Item dist/engine-sim-tuner/assets/engines/custom -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item web dist/engine-sim-tuner/web -Recurse
          Copy-Item README.md, LICENSE dist/engine-sim-tuner/
          Compress-Archive -Path dist/engine-sim-tuner -DestinationPath engine-sim-tuner-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: engine-sim-tuner-windows
          path: engine-sim-tuner-windows.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: engine-sim-tuner-windows.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libsdl2-dev libsdl2-image-dev libboost-filesystem-dev flex bison libgl-dev

      - name: Patch submodules
        run: scripts/apply-linux-patches.sh

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target engine-sim-server -j 4
