        $("dChart").innerHTML = s + `</svg><div class="help" style="margin:0 0 0 46px">durchgezogen = Drehmoment (Nm, links) · gestrichelt = Leistung (PS, rechts) · Punkt = Maximum · roter Punkt = Klopfen · gepunktete Linie = Nockenumschaltung</div>`;
    }

    // "klopft ab 4200 U/min" for runs in which at least a tenth of the cycles knocked
    function knockText(r) {
        const first = r.points.find(p => p.knock >= 0.1);
        return first ? `<small class="chg" style="color:#ff7b72">klopft ab ${Math.round(first.rpm)} U/min</small>` : "";
    }

    function renderRuns() {
        $("dRuns").innerHTML = (runs.length ? "" : `<div class="help">Jeder Messlauf wird hier gespeichert. Ändere etwas und miss erneut, um die Auswirkung zu sehen.</div>`)
            + runs.map((r, i) => {
                const pn = peak(r.points, "nm"), pk = r.points.reduce((b, p) => (p.kw > b.kw ? p : b), r.points[0]);
                return `<div class="run" data-i="${i}">
                    <span class="sw" data-act="vis" style="background:${r.visible ? r.color : "transparent"};border:2px solid ${r.color}" title="ein-/ausblenden"></span>
                    <div><input class="nm" data-act="name" value="${r.name.replace(/"/g, "&quot;")}">
                        <small>max ${pn.nm.toFixed(0)} Nm @ ${pn.rpm.toFixed(0)} · ${PS(pk.kw).toFixed(0)} PS @ ${pk.rpm.toFixed(0)}</small>${knockText(r)}
                        ${r.changes && r.changes.length ? `<small class="chg">${r.changes.join("<br>")}</small>` : ""}</div>
                    <button class="x" data-act="del" title="Lauf löschen">✕</button></div>`;
            }).join("")
            + (runs.length ? `<div class="row"><button class="sec" id="dCsv">CSV exportieren</button><button class="sec" id="dClear">Alle löschen</button></div>` : "");
    }

    $("dRuns").addEventListener("click", ev => {
        const row = ev.target.closest(".run"), act = ev.target.dataset && ev.target.dataset.act;
        if (row && act === "vis") { const r = runs[+row.dataset.i]; r.visible = !r.visible; }
        else if (row && act === "del") { runs.splice(+row.dataset.i, 1); hoverRun = null; }
        else if (ev.target.id === "dClear") { runs = []; hoverRun = null; }
        else if (ev.target.id === "dCsv") {
            const lines = ["lauf;rpm;Nm;kW;PS;MAP_kPa;zuendwinkel_deg"];
            runs.filter(r => r.visible).forEach(r => r.points.forEach(p =>
                lines.push([r.name, p.rpm, p.nm.toFixed(1), p.kw.toFixed(2), PS(p.kw).toFixed(1), p.map.toFixed(1), p.adv.toFixed(1)].join(";"))));
            const a = document.createElement("a");
            a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" })); a.download = "prueflauf.csv"; a.click();
            return;
        } else return;
        saveRuns(); renderRuns(); drawDyno();
    });
    function setHover(run) { if (hoverRun !== run) { hoverRun = run; drawDyno(); } }
    $("dRuns").addEventListener("mouseover", ev => {
        const row = ev.target.closest(".run");
        const r = row ? runs[+row.dataset.i] : null;
        setHover(r && r.visible ? r : null);
    });
    $("dRuns").addEventListener("mouseleave", () => setHover(null));
    $("dRuns").addEventListener("input", ev => {
        if (ev.target.dataset.act === "name") { runs[+ev.target.closest(".run").dataset.i].name = ev.target.value; saveRuns(); }
    });

    function setDynoState(text, color) { $("dState").textContent = text; $("dState").style.color = color || "#8b95a1"; }

    async function pollDyno() {
        try {
            const r = await fetch(SIM_URL + "/dyno", { cache: "no-store" });
            const st = await r.json();
            livePoints = st.points || [];
            $("dBar").style.display = "block"; $("dBar").firstElementChild.style.width = Math.round((st.progress || 0) * 100) + "%";
            if (st.state === "starting" || st.state === "running") {
                setDynoState((st.state === "starting" ? "Motor wird gestartet…" : `misst bei ${Math.round(st.rpm)} U/min…`)
                    + (st.damage > 0.02 ? ` · Motorschaden ${Math.round(st.damage * 100)} %` : ""), st.damage > 0.5 ? "#ff7b72" : undefined);
                drawDyno(); setTimeout(pollDyno, 400); return;
            }
            dynoRunning = false; $("dBar").style.display = "none";
            if (st.state === "done" && livePoints.length) {
                const snap = { p: readParams(), cfg: JSON.parse(JSON.stringify(cfg)) };
                const prev = runs[runs.length - 1];
                const color = RUN_COLORS.find(c => !runs.some(r => r.color === c)) || RUN_COLORS[runs.length % RUN_COLORS.length];
                runs.push({ name: `Lauf ${runs.length + 1} (${runMode}) · ${new Date().toLocaleTimeString().slice(0, 5)}`, color, visible: true, points: livePoints, snap, changes: diffSnapshots(prev && prev.snap, snap) });
                saveRuns();
                markCells(livePoints);
                const bad = livePoints.filter(p => !p.held).length;
                setDynoState(bad ? `fertig · ${bad} Punkt(e) ohne stabile Drehzahl` : "fertig", bad ? "#e3b341" : "#7ee787");
            } else setDynoState(st.state === "aborted" ? `abgebrochen: ${st.message}` : "", "#e3b341");
            livePoints = []; renderRuns(); drawDyno(); updateDynoButtons();
        } catch (e) { dynoRunning = false; $("dBar").style.display = "none"; setDynoState("Verbindung verloren", "#ff7b72"); updateDynoButtons(); }
    }

    $("dRun").addEventListener("click", async () => {
        clearTimeout(simTimer); await pushToSim();                       // make sure the simulator runs exactly this engine
        const thr = Math.min(100, Math.max(0, parseFloat($("dThr").value))) / 100;
        const ramp = $("dMode").value === "ramp";
        runMode = ramp ? "Zug" : "Stufen";
        const body = ramp
            ? `mode=ramp\nstart=${$("dStart").value}\nend=0\nrate=${$("dRate").value}\nthrottle=${thr}`     // end=0: up to the rev limiter
            : `mode=steps\nstart=${$("dStart").value}\nend=${$("dEnd").value}\nstep=${$("dStep").value}\nthrottle=${thr}`;
        try {
            const j = await (await fetch(SIM_URL + "/dyno", { method: "POST", headers: { "Content-Type": "text/plain" }, body })).json();
            if (!j.ok) { setDynoState(j.error, "#ff7b72"); return; }
            dynoRunning = true; livePoints = []; setDynoState("startet…"); updateDynoButtons(); pollDyno();
        } catch (e) { setDynoState("Simulator nicht erreichbar", "#ff7b72"); }
    });
    $("dStop").addEventListener("click", () => fetch(SIM_URL + "/dyno/stop", { method: "POST", headers: { "Content-Type": "text/plain" }, body: "x" }));

    function updateDynoButtons() {
        $("dRun").disabled = !simConnected || dynoRunning || $("dl").disabled;
        $("dStop").disabled = !dynoRunning;
    }
    let dEndTouched = false;
    $("dEnd").addEventListener("input", () => { dEndTouched = true; });
    $("dMode").addEventListener("change", () => {           // the pull needs no end speed or step, the steps mode needs no rate
        const ramp = $("dMode").value === "ramp";
        $("dStepsOnly").style.display = ramp ? "none" : "inline";
        $("dRampOnly").style.display = ramp ? "inline" : "none";
    });
    setInterval(updateDynoButtons, 500);
    renderRuns(); drawDyno();

    /* ----- code + stats ----- */
    function refresh(skipTables) {
        const p = readParams();
        let res;
        try { res = generate(p, cfg); } catch (e) { $("msgs").innerHTML = `<div class="err">${e.message}</div>`; return; }
        const a = res.analysis;
        $("dispTotal").innerHTML = a.n && a.vdCyl > 0
            ? `${a.displacement.toFixed(3)} L<small>${a.n} × ${a.vdCyl.toFixed(1)} cc = ${(a.displacement * 1000).toFixed(0)} cc</small>`
            : "-";
        $("stats").innerHTML = [
            `<span class="chip">Hubraum <b>${a.displacement.toFixed(2)} L</b></span>`,
            `<span class="chip">Verdichtung <b>${a.cr.toFixed(1)}:1</b></span>`,
            `<span class="chip">Bohrung/Hub <b>${(p.bore / p.stroke).toFixed(2)}</b></span>`,
            `<span class="chip">Pleuel/Hub <b>${(p.rodLength / p.stroke).toFixed(2)}</b></span>`,
        ].join("");
        const errs = [...autoErrors, ...a.errors];
        $("msgs").innerHTML = errs.map(e => `<div class="err">✗ ${e}</div>`).join("")
            + a.warnings.map(e => `<div class="warn">! ${e}</div>`).join("");
        $("info").innerHTML = a.n ? `Zündfolge: <b>${a.order.join("-")}</b> · Zündabstände: ${a.intervals.map(x => f1(x) + "°").join(" ")} · `
            + (a.even ? `<span class="ok">gleichmäßig</span>` : `<span class="warn">ungleichmäßig</span>`) : "";
        $("code").textContent = errs.length ? "// Bitte zuerst die Fehler links beheben." : res.text;
        $("dl").disabled = $("cp").disabled = errs.length > 0;
        lastCode = res.text;
        scheduleLive(!errs.length);
        if (!dEndTouched) $("dEnd").value = Math.max(1500, Math.floor(p.redline / 500) * 500);
        const fn = $("filename").value;
        $("hint").innerHTML = `Live: im Simulator <b>F5</b> drücken, die Seite verbindet sich automatisch (Port 8765). ` +
            `Dauerhaft: Datei nach <code>assets/engines/custom/${fn}</code> legen und in <code>assets/main.mr</code> ` +
            `<code>import "engines/custom/${fn}"</code> eintragen.`;
        if (!skipTables) syncTables();
        drawGraphics();
        try { localStorage.setItem("engineBuilder", JSON.stringify({ p, cfg })); } catch (e) { /* ignore */ }
    }

    function restore(state) {
        writeParams(state.p);
        cfg = state.cfg; autoErrors = []; sel = -1;
        renderTables(); refresh();
    }

    preset.addEventListener("change", () => {
        writeParams({ ...defaults, ...PRESETS[preset.value] });
        if (!PRESETS[preset.value].firing) inputs.firing.el.value = defaultFiring(inputs.layout.el.value, +inputs.cylinders.el.value);
        applyAuto();
    });
    $("filename").addEventListener("input", () => refresh(true));
    $("dl").addEventListener("click", () => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([lastCode], { type: "text/plain" }));
        a.download = $("filename").value || "engine.mr";
        a.click();
    });
    $("cp").addEventListener("click", () => navigator.clipboard.writeText(lastCode));
    $("jsave").addEventListener("click", () => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([JSON.stringify({ p: readParams(), cfg }, null, 1)], { type: "application/json" }));
        a.download = ($("filename").value || "engine").replace(/\.mr$/, "") + ".json";
        a.click();
    });
    $("jload").addEventListener("click", () => $("jfile").click());
    $("jfile").addEventListener("change", async () => {
        const file = $("jfile").files[0];
        if (file) { try { restore(JSON.parse(await file.text())); } catch (e) { alert("Datei konnte nicht gelesen werden: " + e.message); } }
    });

    // initial state: restore last session if present, else defaults
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem("engineBuilder")); } catch (e) { /* ignore */ }
    if (saved && saved.p && saved.cfg && Array.isArray(saved.cfg.banks)) restore(saved);
    else { writeParams(defaults); applyAuto(); }
}
</script>
</body>
</html>
